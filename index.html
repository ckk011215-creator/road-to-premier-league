<title>Road to Premier League｜英超之路</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+HK:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<style>/* 版面：手機優先單欄「比賽日場刊＋球探簿」；頂部記分牌式資料列，底部分頁 */
:root{
  --paper:#EEF1F6; --card:#FFFFFF; --ink:#14203A; --muted:#5E6878; --line:#DCE1EA;
  --bib:#F2B705; --bib-ink:#1C1A10; --pitch:#2E7D4F; --bad:#C0392B; --gold:#9A7414; --soft:#F2F4F8; --bar:#111A2E; --bar-ink:#E9EDF5;
  --sh:0 1px 2px rgba(17,26,46,.06), 0 4px 16px rgba(17,26,46,.06);
  --f-display:'Barlow Condensed','Arial Narrow','Noto Sans HK',sans-serif;
  --f-body:'Noto Sans HK','PingFang HK','Microsoft JhengHei',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0C1220; --card:#151E30; --ink:#E6EAF2; --muted:#9AA4B5; --line:#26324A;
  --bib:#FFC83D; --bib-ink:#1C1A10; --pitch:#63B583; --bad:#E2705F; --gold:#E0B44A; --soft:#1A2438; --bar:#080D18; --bar-ink:#E6EAF2; --sh:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0C1220; --card:#151E30; --ink:#E6EAF2; --muted:#9AA4B5; --line:#26324A;
  --bib:#FFC83D; --bib-ink:#1C1A10; --pitch:#63B583; --bad:#E2705F; --gold:#E0B44A; --soft:#1A2438; --bar:#080D18; --bar-ink:#E6EAF2; --sh:none; color-scheme:dark }

*{ box-sizing:border-box }
[hidden]{ display:none!important }
html,body{ background:var(--paper); color:var(--ink) }
body{ margin:0; font-family:var(--f-body); font-size:15px; line-height:1.6; -webkit-text-size-adjust:100% }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bar) }
button{ font:inherit; color:inherit }
:focus-visible{ outline:2px solid var(--bib); outline-offset:2px }
.wrap{ width:100%; max-width:640px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
h1,h2,h3{ text-wrap:balance; margin:0 }
.hint{ color:var(--muted); font-size:13px }
.num{ font-family:var(--f-display); font-variant-numeric:tabular-nums }

/* ---------- 開始畫面 ---------- */
#start{ min-height:100%; display:flex; flex-direction:column }
.hero{ background:var(--bar); color:var(--bar-ink); padding-block:40px 32px; position:relative; overflow:hidden }
.hero .wrap{ position:relative; z-index:1 }
.hero canvas{ position:absolute; inset:0; width:100%; height:100%; opacity:.22 }
.eyebrow{ font-family:var(--f-display); letter-spacing:.14em; text-transform:uppercase; font-size:13px; color:var(--bib) }
.title{ font-family:var(--f-body); font-weight:900; font-size:clamp(40px,11vw,64px); line-height:1.05; letter-spacing:-.01em; margin-top:8px }
.title em{ font-style:normal; color:var(--bib) }
.title.en{ font-family:var(--f-display); font-weight:700; text-transform:uppercase; font-size:clamp(46px,14vw,80px); line-height:.95; letter-spacing:.01em }
.title-zh{ font-family:var(--f-body); font-weight:900; font-size:clamp(22px,6vw,30px); letter-spacing:.3em; margin-top:6px; color:var(--bib) }
.lede{ max-width:34em; margin-top:14px; color:color-mix(in srgb,var(--bar-ink) 82%,transparent) }
.ladder{ display:flex; gap:6px; flex-wrap:wrap; margin-top:20px; font-family:var(--f-display); font-size:14px }
.ladder span{ border:1px solid color-mix(in srgb,var(--bar-ink) 35%,transparent); padding:2px 8px; border-radius:4px }
.ladder span:last-child{ background:var(--bib); color:var(--bib-ink); border-color:var(--bib) }
.startbtns{ display:grid; gap:10px; padding-block:24px }

/* ---------- 通用按鈕 ---------- */
.btn{ display:block; width:100%; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r); padding:12px 14px; cursor:pointer; transition:transform .12s, border-color .12s }
.btn:hover{ border-color:var(--ink) }
.btn:active{ transform:scale(.99) }
.btn b{ display:block; font-weight:700 }
.btn small{ display:block; color:var(--muted); font-size:13px; margin-top:2px }
.btn.main{ background:var(--bib); border-color:var(--bib); color:var(--bib-ink) }
.btn.main small{ color:color-mix(in srgb,var(--bib-ink) 70%,transparent) }
.btn.warn{ border-style:dashed; border-color:var(--bad) }
.btn[disabled]{ opacity:.45; cursor:not-allowed }

/* ---------- 角色創建 ---------- */

#create{ padding-block:20px 150px }
.c-head h1{ font-size:30px; margin-top:4px }
.c-head .hint{ margin-top:8px }
.sec{ border-top:2px solid var(--ink); padding-block:14px 18px; display:grid; gap:10px }
.sec h2{ font-family:var(--f-display); font-size:22px; letter-spacing:.04em; display:flex; justify-content:space-between; align-items:center }
.field{ display:grid; gap:6px; min-width:0 }
.field > label, .field > .lbl{ font-weight:700; font-size:14px }
.field .hint{ margin:0 }
.sec > .hint{ margin:0 }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
input[type=text], select{ font:inherit; width:100%; padding:10px 12px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); color:var(--ink) }
input[type=range]{ width:100%; accent-color:var(--ink) }

/* 選項卡：名稱＋點數＋一句效果 */
.opts{ display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); gap:8px }
.opt{ text-align:left; display:grid; gap:2px; align-content:start; border:1.5px solid var(--line); border-radius:10px; background:var(--card); padding:9px 10px; cursor:pointer; min-width:0 }
.opt .ot{ display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap }
.opt b{ font-size:15px }
.opt small{ font-size:12px; line-height:1.35; color:var(--muted) }
.opt[aria-pressed="true"]{ border-color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink); background:color-mix(in srgb,var(--bib) 10%,var(--card)) }
@media (max-width:420px){ .opts[style*="--cols:4"]{ --cols:2 !important } }
.cost{ font-style:normal; font-size:11px; padding:1px 6px; border-radius:999px; font-weight:700; white-space:nowrap; background:var(--bib); color:var(--bib-ink) }
.cost.back{ background:color-mix(in srgb,var(--pitch) 16%,var(--card)); color:var(--pitch) }
.cost.free{ background:var(--soft); color:var(--muted); font-weight:500 }
.cost-r .cost{ font-size:12px }

/* 出生月份 */
.months{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px }
.mo{ border:1.5px solid var(--line); border-radius:8px; background:var(--card); padding:6px 0 5px; cursor:pointer; display:grid; gap:1px; justify-items:center }
.mo b{ font-size:14px }
.mo i{ font-style:normal; font-size:11px; color:var(--muted) }
.mo i.pay{ color:var(--gold); font-weight:700 }
.mo i.back{ color:var(--pitch); font-weight:700 }
.mo[aria-pressed="true"]{ border-color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink); background:color-mix(in srgb,var(--bib) 10%,var(--card)) }

/* 性格 */
.pers{ display:grid; gap:4px }
.pers .p{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 0; border-bottom:1px solid var(--line) }
.pers .p > span{ font-weight:700 }
.pers .p small{ font-weight:400; color:var(--muted); font-size:12.5px; margin-left:8px }
.pips{ display:flex; gap:4px }
.pips i{ flex:1; height:8px; border-radius:2px; background:var(--soft) }
.pips i.on{ background:var(--ink) }
.step{ display:flex; align-items:center; gap:8px }
.step b{ min-width:1.2em; text-align:center; font-size:20px }
.step button{ width:34px; height:34px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); cursor:pointer; font-weight:700; font-size:16px }
.note{ background:var(--soft); border-radius:8px; padding:8px 12px; font-size:13px; color:var(--muted) }

/* 底部點數列 */
.createbar{ position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line); padding-block:10px calc(10px + env(safe-area-inset-bottom,0px)); z-index:20 }
.createbar .wrap{ display:grid; gap:8px }
.budget{ display:grid; gap:4px }
.budget > span{ font-size:13px; color:var(--muted) }
.budget > span b{ font-size:20px; color:var(--ink) }
.budget.over > span b{ color:var(--bad) }
.seg{ display:grid; grid-template-columns:repeat(10,1fr); gap:3px }
.seg i{ height:6px; border-radius:2px; background:var(--bib) }
.seg i.used{ background:var(--soft) }
.budget.over .seg i{ background:var(--bad) }
.cb-btns{ display:grid; grid-template-columns:auto 1fr; gap:8px }
.createbar .btn{ text-align:center; padding-block:10px }

/* ---------- 遊戲畫面 ---------- */
#game{ padding-bottom:calc(76px + env(safe-area-inset-bottom,0px)) }
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:15; background:var(--bar); color:var(--bar-ink); border-bottom:1px solid var(--line) }
.top .wrap{ padding-block:10px 8px }
.top .r1{ display:flex; justify-content:space-between; align-items:baseline; gap:10px }
.top .nm{ font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0 }
.top .age{ font-family:var(--f-display); font-size:26px; line-height:1; color:var(--bib); white-space:nowrap }
.top .age small{ font-size:13px; color:color-mix(in srgb,var(--bar-ink) 70%,transparent); margin-left:3px }
.top .r2{ font-size:13px; color:color-mix(in srgb,var(--bar-ink) 75%,transparent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.meters{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px 10px; margin-top:8px }
.mt{ font-size:11.5px; min-width:0 }
.mt span{ display:flex; justify-content:space-between; color:color-mix(in srgb,var(--bar-ink) 75%,transparent) }
.mt span b{ font-family:var(--f-display); font-size:13px; color:var(--bar-ink) }
.mt i{ display:block; height:4px; border-radius:2px; background:color-mix(in srgb,var(--bar-ink) 18%,transparent); margin-top:2px; overflow:hidden }
.mt i u{ display:block; height:100%; background:var(--bib) }
.mt.bad i u{ background:var(--bad) }

.pagehead{ font-family:var(--f-display); font-size:20px; letter-spacing:.06em; text-transform:uppercase; padding-block:18px 6px; color:var(--muted); display:flex; align-items:center; gap:10px }
.pagehead::after{ content:""; flex:1; height:1.5px; background:var(--line) }
#feed{ display:grid; gap:10px }
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; animation:rise .25s ease-out }
.card h4{ margin:0 0 4px; font-size:15px; display:flex; gap:8px; align-items:center }
.card h4 .tag{ font-family:var(--f-display); font-weight:600; font-size:12px; letter-spacing:.08em; text-transform:uppercase; padding:1px 6px; border-radius:3px; background:var(--soft); color:var(--muted) }
.card p{ margin:.3em 0 0 }
.card .fx{ margin-top:8px; font-size:13px; color:var(--muted); border-top:1px dashed var(--line); padding-top:6px }
.card.good{ border-left:4px solid var(--pitch) }
.card.bad{ border-left:4px solid var(--bad) }
.card.gold{ border-left:4px solid var(--bib); background:color-mix(in srgb,var(--bib) 10%,var(--card)) }
.card.event{ border-left:4px solid var(--ink) }
.card.info{ border-left:4px solid var(--muted) }
.card.summary{ background:var(--soft); border-color:transparent }
.card.cohort{ border-left:4px dotted var(--ink) }
.card.echo{ background:transparent; border:none; padding:0 4px; font-size:13px; color:var(--muted); animation:none }
.card.echo > div::before{ content:"▸ "; color:var(--ink) }
.card.moment{ background:var(--bar); color:var(--bar-ink); border-color:var(--bar) }
.card.moment h4 .tag{ background:color-mix(in srgb,var(--bar-ink) 15%,transparent); color:var(--bar-ink) }
.score{ display:flex; align-items:center; gap:14px; font-family:var(--f-display); margin:4px 0 6px }
.score span{ font-family:var(--f-body); font-size:13px; color:var(--bib); border:1px solid var(--bib); padding:0 6px; border-radius:3px }
.score b{ font-size:32px; line-height:1 }
.sc-t{ font-weight:700 }
.card.goalfx{ border:2px solid var(--bib) }
.card.goalfx h4{ font-family:var(--f-display); font-size:28px; letter-spacing:.04em; color:var(--gold) }
.grades{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:6px 0 }
.gr{ display:flex; justify-content:space-between; align-items:center; border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:13px }
.gr i{ font-style:normal }
.gr.key i{ font-weight:700 }
.gr b{ font-family:var(--f-display); font-size:18px }
.g-Ap,.g-A{ color:var(--pitch) } .g-D,.g-E{ color:var(--bad) }
.statline{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center; margin:6px 0 }
.statline span{ font-size:12px; color:var(--muted) }
.statline b{ display:block; font-family:var(--f-display); font-size:28px; line-height:1.1; color:var(--ink) }

#act{ display:grid; gap:8px; padding-block:12px 4px }
#act .q{ font-weight:700; font-size:14px }
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:8px }
.tile{ text-align:left; border:1.5px solid var(--line); border-radius:var(--r); background:var(--card); padding:10px 12px; cursor:pointer; min-width:0 }
.tile b{ display:block }
.tile small{ display:block; font-size:12.5px; color:var(--muted); line-height:1.4; margin-top:2px }
.tile .tg{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px }
.tile .tg em{ font-style:normal; font-size:11.5px; background:var(--soft); border-radius:3px; padding:0 5px }
.tile[aria-pressed="true"]{ border-color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink) }
.tile[aria-pressed="true"] b::after{ content:" ✓"; color:var(--pitch) }
.tile[disabled]{ opacity:.45; cursor:not-allowed }

/* ---------- 分頁 ---------- */
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px) }
.tabs .wrap{ display:grid; grid-template-columns:repeat(4,1fr) }
.tabs button{ background:none; border:none; padding:10px 0 12px; cursor:pointer; font-size:13px; color:var(--muted); border-top:3px solid transparent }
.tabs button[aria-selected="true"]{ color:var(--ink); border-top-color:var(--bib); font-weight:700 }
.panel{ padding-block:12px 20px; display:grid; gap:14px }
.panel h3{ font-family:var(--f-display); font-size:20px; letter-spacing:.05em; text-transform:uppercase; border-bottom:2px solid var(--ink); padding-bottom:2px }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:14px }
.kv dt{ color:var(--muted) }
.kv dd{ margin:0 }
.attr{ display:grid; grid-template-columns:3.2em 1fr 4.6em; gap:10px; align-items:center; font-size:14px }
.attr .bar{ position:relative; height:10px; background:var(--soft); border-radius:3px }
.attr .bar u{ position:absolute; top:0; bottom:0; background:var(--ink); opacity:.75; border-radius:3px }
.attr .rng{ font-family:var(--f-display); font-size:15px; text-align:right; font-variant-numeric:tabular-nums }
.attr.key b{ text-decoration:underline; text-decoration-color:var(--bib); text-decoration-thickness:3px; text-underline-offset:3px }
.posfit{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:12px }
.posfit div{ border:1px solid var(--line); border-radius:6px; padding:4px 0 }
.posfit div.cur{ background:var(--ink); color:var(--paper) }
.posfit b{ display:block; font-family:var(--f-display); font-size:16px }
.npc{ display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px }
.npc small{ grid-column:1/-1; color:var(--muted); font-size:12.5px }
.npc em{ font-style:normal; font-size:11.5px; background:var(--bib); color:var(--bib-ink); border-radius:3px; padding:0 5px; margin-left:4px }
.tablewrap{ overflow-x:auto }
table.hist{ border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap }
table.hist th, table.hist td{ padding:5px 6px; border-bottom:1px solid var(--line); text-align:right }
table.hist th:nth-child(-n+3), table.hist td:nth-child(-n+3){ text-align:left }
table.hist th{ font-weight:700; color:var(--muted); font-size:12px }
.timeline{ display:grid; gap:4px; font-size:13.5px }
.timeline div{ display:grid; grid-template-columns:3em 1fr; gap:8px }
.timeline b{ font-family:var(--f-display); font-size:15px; color:var(--muted) }
.honours{ display:flex; flex-wrap:wrap; gap:6px }
.honours span{ background:color-mix(in srgb,var(--bib) 22%,var(--card)); border:1px solid var(--bib); border-radius:4px; padding:2px 8px; font-size:13px }
.big{ font-family:var(--f-display); font-size:44px; line-height:1; color:var(--ink) }
.toprow{ display:flex; justify-content:flex-end; gap:6px }
.linkbtn{ background:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; font-size:13px; cursor:pointer; color:var(--muted) }

/* ---------- 結局 ---------- */
#end{ padding-block:0 40px }
#end .hero{ padding-block:32px 28px }
.tier{ font-weight:900; font-size:clamp(34px,9vw,52px); line-height:1.1; margin-top:6px }
.endstats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:18px; text-align:center }
.endstats b{ display:block; font-family:var(--f-display); font-size:30px; color:var(--bib); line-height:1 }
.endstats span{ font-size:12px; color:color-mix(in srgb,var(--bar-ink) 75%,transparent) }

@keyframes rise{ from{ transform:translateY(6px); opacity:.4 } to{ transform:none; opacity:1 } }
@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important } }
@media (max-width:380px){ .tiles{ grid-template-columns:1fr } .grades{ grid-template-columns:repeat(2,1fr) } .meters{ grid-template-columns:repeat(4,1fr) } }

/* ---------- 選單 ---------- */
.top .r1r{ display:flex; align-items:center; gap:12px; flex-shrink:0 }
.menubtn{ background:none; border:1px solid color-mix(in srgb,var(--bar-ink) 40%,transparent); color:var(--bar-ink); border-radius:6px; padding:4px 10px; font-size:13px; cursor:pointer }
.sheet{ position:fixed; inset:0; z-index:40; background:color-mix(in srgb,#000 45%,transparent); display:flex; align-items:flex-end }
.sheet-in{ width:100%; background:var(--paper); border-top:3px solid var(--bib); border-radius:14px 14px 0 0; padding-block:18px calc(18px + env(safe-area-inset-bottom,0px)) }
.sheet h2{ font-family:var(--f-display); font-size:22px; letter-spacing:.05em; text-transform:uppercase; margin-bottom:10px }
#menu-body{ display:grid; gap:8px }


/* ---------- 天賦上限預覽 ---------- */
.capstrip{ position:sticky; top:env(safe-area-inset-top,0px); z-index:18; background:var(--paper); border-bottom:1px solid var(--line); padding-block:6px }
.cs-h{ font-size:11.5px; color:var(--muted); letter-spacing:.04em }
.cs-row{ display:grid; grid-template-columns:repeat(9,1fr); gap:2px; text-align:center }
.cs-row div{ border-radius:5px; padding:2px 0; min-width:0 }
.cs-row span{ display:block; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden }
.cs-row b{ font-size:18px; line-height:1.1 }
.cs-row .chg.up{ background:color-mix(in srgb,var(--pitch) 18%,transparent) } .cs-row .chg.up b{ color:var(--pitch) }
.cs-row .chg.dn{ background:color-mix(in srgb,var(--bad) 16%,transparent) } .cs-row .chg.dn b{ color:var(--bad) }
.radar{ width:100%; max-width:360px; height:auto; display:block; margin:0 auto }
.radar .rg{ fill:none; stroke:var(--line); stroke-width:1 }
.radar .ra{ stroke:var(--line); stroke-width:1 }
.radar .rp-base{ fill:none; stroke:var(--muted); stroke-width:1.5; stroke-dasharray:4 3 }
.radar .rp-me{ fill:color-mix(in srgb,var(--bib) 30%,transparent); stroke:var(--bib); stroke-width:2 }
.radar .rl{ font-size:12px; fill:var(--ink); font-family:var(--f-body) }
.radar .rl.up{ fill:var(--pitch); font-weight:700 } .radar .rl.dn{ fill:var(--bad); font-weight:700 }
.rp-key{ display:flex; justify-content:center; gap:16px; font-size:12.5px; color:var(--muted) }
.rp-key span::before{ content:""; display:inline-block; width:16px; height:0; margin-right:6px; vertical-align:middle }
.rp-key .k-base::before{ border-top:2px dashed var(--muted) } .rp-key .k-me::before{ border-top:3px solid var(--bib) }
.capsrc{ list-style:none; margin:0; padding:0; display:grid; gap:4px; font-size:13.5px }
.capsrc li{ display:grid; grid-template-columns:7.5em 1fr; gap:8px; padding:4px 0; border-bottom:1px solid var(--line) }
.capsrc li b{ font-weight:700 }
.hbands{ display:grid; grid-template-columns:repeat(5,1fr); gap:4px }
.hbands div{ border:1px solid var(--line); border-radius:6px; padding:4px 5px; display:grid; gap:1px; min-width:0 }
.hbands div.on{ border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); background:color-mix(in srgb,var(--bib) 10%,var(--card)) }
.hbands b{ font-size:12.5px } .hbands small{ font-size:10.5px; line-height:1.3; color:var(--muted) }
@media (max-width:420px){ .hbands{ grid-template-columns:repeat(3,1fr) } }
.opt.clash{ opacity:.4 }

/* ---------- 像素美術 ---------- */
:root{ --f-pixel:'Press Start 2P','Courier New',monospace }
.pxic{ width:26px; height:auto; image-rendering:pixelated; flex-shrink:0 }
.card h4{ align-items:center }
.pxwrap{ position:relative; margin:6px 0 8px; border-radius:6px; overflow:hidden; border:2px solid color-mix(in srgb,var(--bar-ink) 25%,transparent) }
.pxpitch{ display:block; width:100%; height:auto; image-rendering:pixelated }
.pxfx{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-pixel); font-size:clamp(16px,6vw,26px); color:#fff; text-shadow:3px 3px 0 #1b1f2a; opacity:0; pointer-events:none }
.pxfx.show{ opacity:1; animation:pxpop .5s steps(4) both }
.pxfx.ok{ color:var(--bib) } .pxfx.ng{ color:#ff8a7a }
@keyframes pxpop{ 0%{ transform:scale(2.2); opacity:0 } 60%{ transform:scale(.9); opacity:1 } 100%{ transform:scale(1) } }
.btn.odds{ position:relative; padding-bottom:16px }
.pbar{ position:absolute; left:14px; right:14px; bottom:7px; height:4px; border-radius:2px; background:var(--soft); overflow:hidden }
.pbar i{ display:block; height:100%; background:var(--pitch) }
.btn.main .pbar{ background:color-mix(in srgb,var(--bib-ink) 18%,transparent) } .btn.main .pbar i{ background:var(--bib-ink) }
.btn.locked{ opacity:.55; border-style:dashed; cursor:not-allowed }
.btn .lk{ font-style:normal; font-size:11px; font-weight:700; float:right; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:0 5px }
.top .who{ display:flex; align-items:center; gap:8px; min-width:0 }
.top .av{ width:30px; height:auto; image-rendering:pixelated; flex-shrink:0 }
.hero-px{ position:relative; height:84px; width:120px; margin-top:16px }
.hero-px img{ position:absolute; left:0; top:0; height:84px; image-rendering:pixelated }
.hero-px #hp2{ opacity:0 }
.hero-px .b{ height:30px; left:70px; top:54px }
@media (prefers-reduced-motion: no-preference){
  .hero-px #hp1{ animation:kf1 1.2s steps(1) infinite } .hero-px #hp2{ animation:kf2 1.2s steps(1) infinite }
  .hero-px .b{ animation:kb 1.2s steps(6) infinite }
}
@keyframes kf1{ 0%,60%{ opacity:1 } 61%,100%{ opacity:0 } }
@keyframes kf2{ 0%,60%{ opacity:0 } 61%,100%{ opacity:1 } }
@keyframes kb{ 0%,60%{ transform:translate(0,0) } 80%{ transform:translate(30px,-26px) } 100%{ transform:translate(54px,-8px) } }
.end-px{ display:flex; gap:14px; align-items:flex-end; margin-bottom:12px }
.end-px img{ height:84px; image-rendering:pixelated }

/* ---------- 創建步驟 ---------- */
.steps{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:6px }
.steps button{ background:none; border:none; border-bottom:3px solid var(--line); padding:6px 0 5px; font-size:12.5px; color:var(--muted); cursor:pointer; white-space:nowrap }
.steps button.done{ color:var(--ink); border-bottom-color:color-mix(in srgb,var(--bib) 55%,var(--line)) }
.steps button.on{ color:var(--ink); font-weight:700; border-bottom-color:var(--bib) }
.c-body{ padding-block:4px 8px; display:grid; gap:14px }
.c-head{ text-align:center; padding-top:10px }
.c-head h1{ font-size:28px; margin:0 }
.c-head .sub{ margin:6px 0 0; color:var(--muted); font-size:14.5px }
.c-head .hl{ color:var(--ink); background:color-mix(in srgb,var(--bib) 35%,transparent); padding:0 4px; border-radius:3px }
#create{ padding-block:0 150px }
.btn.next{ background:var(--ink); border-color:var(--ink); color:var(--paper); text-align:center }
.opt.wide{ width:100% }
.kv.sum{ font-size:14px; border-top:1px solid var(--line); padding-top:10px }

/* 能力加成標籤 */
.mchips{ display:flex; flex-wrap:wrap; gap:6px }
.mchips span{ border:1.5px solid var(--line); border-radius:999px; padding:3px 11px; font-size:13px; background:var(--card) }
.mchips b{ color:var(--gold); margin-right:2px }
.mchips span.neg b{ color:var(--bad) }

/* 資訊卡 */
.infocard{ border:1.5px solid var(--line); border-radius:14px; background:var(--card); padding:14px 16px; display:grid; gap:8px }
.infocard.sel{ border-color:var(--bib) }
.infocard > b{ font-size:22px }
.infocard p{ margin:0 }
.infocard .side{ font-size:13.5px; color:var(--pitch); font-weight:700 }
.eyebrow2{ font-family:var(--f-display); font-weight:700; letter-spacing:.12em; font-size:13px; color:var(--gold); text-transform:uppercase }
.ref{ display:flex; gap:10px; align-items:baseline; border-top:1px solid var(--line); padding-top:8px }
.ref span{ font-size:12px; color:var(--muted); letter-spacing:.08em }
.ref b{ font-size:17px }

/* 角色卡 */
.rolecards{ display:grid; gap:12px }
.rolecard{ position:relative; text-align:left; display:grid; gap:6px; border:1.5px solid var(--line); border-radius:16px; background:var(--card); padding:16px 18px; cursor:pointer }
.rolecard .code{ font-family:var(--f-display); font-weight:700; letter-spacing:.14em; font-size:13px; color:var(--gold) }
.rolecard > b{ font-size:24px; line-height:1.2 }
.rolecard .desc{ color:var(--muted); font-size:15px }
.rolecard[aria-pressed="true"]{ border-color:var(--bib); box-shadow:0 0 0 1.5px var(--bib) }
.rolecard[aria-pressed="true"]::after{ content:"✓"; position:absolute; top:14px; right:16px; width:32px; height:32px; border-radius:50%; background:var(--bib); color:var(--bib-ink); display:grid; place-items:center; font-weight:900 }

/* 球場位置圖 */
.pitchpick{ position:relative; width:100%; max-width:420px; margin:0 auto; aspect-ratio:100/110; border-radius:12px; overflow:hidden;
  background:repeating-linear-gradient(180deg,#3f8f4f 0 10%,#479a57 10% 20%) }
.pp-lines{ position:absolute; inset:0; width:100%; height:100% }
.pp-lines *{ fill:none; stroke:rgba(255,255,255,.7); stroke-width:.6 }
.pp-arrow{ position:absolute; top:4px; left:8px; font-size:11px; color:rgba(255,255,255,.85); z-index:1 }
.pp-spot{ position:absolute; transform:translate(-50%,-50%); background:none; border:none; padding:0; display:grid; justify-items:center; gap:2px; cursor:pointer; z-index:2 }
.pp-spot i{ width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.92); border:3px solid #1b1f2a; box-shadow:0 2px 0 rgba(0,0,0,.25) }
.pp-spot span{ font-size:12px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7); white-space:nowrap }
.pp-spot[aria-pressed="true"] i{ background:var(--bib); transform:scale(1.2) }
.pp-spot[aria-pressed="true"] span{ background:var(--bib); color:var(--bib-ink); text-shadow:none; padding:0 6px; border-radius:4px }
.pp-spot[data-spot="GK"] i{ background:#c9b8ff }


/* ================= 遊戲畫面（電腦版優先）：側欄球員卡＋主頁儀表板＋事件視窗 ================= */
#game{ display:grid; grid-template-columns:288px minmax(0,1fr); min-height:100vh; max-width:1480px; margin:0 auto }
body.modal-open{ overflow:hidden }
.side{ background:var(--bar); color:var(--bar-ink); position:sticky; top:0; height:100vh; overflow:auto; padding:18px 16px; display:flex; flex-direction:column; gap:14px }
.side-card{ --kit:#F2B705; border-radius:16px; padding:14px; background:linear-gradient(165deg, color-mix(in srgb,var(--kit) 55%,#111A2E) 0%, #111A2E 62%); border:1px solid color-mix(in srgb,var(--kit) 50%,transparent); box-shadow:0 8px 24px rgba(0,0,0,.25) }
.pc-top{ display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center }
.pc-ovr b{ display:block; font-family:var(--f-display); font-size:46px; line-height:.9; color:#FFD54A }
.pc-ovr small,.pc-pos small{ font-size:11px; color:rgba(233,237,245,.7) }
.pc-pos b{ display:block; font-size:15px }
.pc-av{ width:60px; image-rendering:pixelated }
.pc-name{ margin-top:10px; font-weight:900; font-size:18px; letter-spacing:.02em }
.pc-club{ font-size:12.5px; color:rgba(233,237,245,.75); margin-bottom:10px }
.pc-attrs{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px 10px; border-top:1px solid rgba(255,255,255,.14); padding-top:10px }
.pc-attrs span{ display:flex; align-items:baseline; gap:6px }
.pc-attrs b{ font-family:var(--f-display); font-size:20px; min-width:1.6em }
.pc-attrs i{ font-style:normal; font-size:12px; color:rgba(233,237,245,.75) }
.pc-attrs .key b{ color:#FFD54A }
.side-m{ display:grid; gap:8px; background:rgba(255,255,255,.04); border-radius:12px; padding:12px }
.side-m .mt span{ display:flex; justify-content:space-between; font-size:12.5px; color:rgba(233,237,245,.8) }
.side-m .mt b{ font-family:var(--f-display); font-size:15px; color:var(--bar-ink) }
.side-m .mt i{ display:block; height:5px; border-radius:3px; background:rgba(255,255,255,.12); margin-top:3px }
.side-m .mt u{ display:block; height:100%; border-radius:3px; background:#4CC38A }
.side-m .mt.bad u{ background:#E2705F }
.side-m .inj{ font-size:12.5px; color:#FFB4A8 }
.snav{ display:grid; gap:4px }
.snav button{ display:flex; align-items:center; gap:10px; background:none; border:none; color:rgba(233,237,245,.78); text-align:left; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:15px; border-left:3px solid transparent }
.snav button i{ font-style:normal; width:1.2em; text-align:center; opacity:.8 }
.snav button:hover{ background:rgba(255,255,255,.06) }
.snav button[aria-current="page"]{ background:rgba(255,255,255,.09); color:#fff; border-left-color:var(--bib); font-weight:700 }
.side-menu{ margin-top:auto; background:none; border:1px solid rgba(255,255,255,.2); color:var(--bar-ink); border-radius:10px; padding:8px; cursor:pointer }
.gmain{ padding:22px 28px 48px; min-width:0 }
.gtop{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px }
.gtop h1{ font-size:24px; font-weight:900 }
.gtop p{ margin:2px 0 0; color:var(--muted); font-size:13.5px }
.gact{ display:flex; gap:10px }
.btn.sm{ width:auto; padding:9px 16px; border-radius:10px; text-align:center }
.btn.center{ text-align:center }
.home,.pgrid{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:16px; align-items:start }
.pc{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--sh); min-width:0; grid-column:span 12 }
.pc h3{ font-size:15px; font-weight:900; margin-bottom:10px; letter-spacing:.02em; border:none; padding:0; font-family:var(--f-body); text-transform:none }
.span4{ grid-column:span 4 } .span5{ grid-column:span 5 } .span6{ grid-column:span 6 } .span7{ grid-column:span 7 } .span8{ grid-column:span 8 } .span12{ grid-column:span 12 }
.stack{ display:grid; gap:16px }
.tall{ grid-row:span 2 }
/* 下一件事 */
.nb{ --kit:#F2B705; grid-column:span 12; display:flex; justify-content:space-between; align-items:center; gap:20px; border-radius:16px; padding:22px 26px; color:#fff;
  background:linear-gradient(120deg, #111A2E 0%, #1B2A4A 55%, color-mix(in srgb,var(--kit) 70%,#1B2A4A) 100%); box-shadow:var(--sh) }
.nb-k{ display:inline-block; font-size:12px; font-weight:700; padding:2px 10px; border-radius:99px; background:rgba(255,255,255,.14) }
.nb-vs{ display:flex; align-items:center; gap:18px; margin:10px 0 6px; font-size:24px; font-weight:900 }
.nb-vs i{ font-style:normal; font-family:var(--f-display); font-size:22px; color:#FFD54A }
.nb-h{ font-size:24px; font-weight:900; margin:10px 0 6px }
.nb small{ color:rgba(255,255,255,.75); font-size:13px }
.nb-go{ width:auto; padding:14px 28px; font-size:17px; text-align:center; flex-shrink:0 }
/* 積分榜／同屆排名 */
.lt{ max-height:420px; overflow:auto; margin:0 -6px }
.lt table{ width:100%; border-collapse:collapse; font-size:13.5px }
.lt th{ text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:4px 6px; position:sticky; top:0; background:var(--card) }
.lt td{ padding:5px 6px; border-top:1px solid var(--line); white-space:nowrap }
.lt td:first-child{ color:var(--muted); width:1.8em }
.lt td:nth-child(2){ white-space:normal }
.lt tr.me td{ background:color-mix(in srgb,var(--bib) 18%,transparent); font-weight:700 }
.lt tr.up td:first-child{ color:var(--pitch); font-weight:700 } .lt tr.dn td:first-child{ color:var(--bad); font-weight:700 }
.lt .tg{ font-style:normal; font-size:11px; background:var(--bib); color:var(--bib-ink); border-radius:3px; padding:0 4px }
/* 近期表現 */
.form{ display:flex; gap:16px; font-size:13px; color:var(--muted); margin-bottom:8px } .form b{ color:var(--ink); font-size:15px }
.fbars{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; height:150px; align-items:end }
.fb{ display:grid; grid-template-rows:auto 1fr auto; height:100%; text-align:center; gap:4px }
.fb b{ font-family:var(--f-display); font-size:16px }
.fb i{ align-self:end; display:block; background:var(--soft); border-radius:6px 6px 2px 2px; background:color-mix(in srgb,var(--ink) 55%,transparent) }
.fb i.hi{ background:var(--pitch) } .fb i.lo{ background:var(--bad) }
.fb.e i{ height:8%; background:var(--soft) }
.fb small{ font-size:12px; color:var(--muted) }
.ssg{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px }
.ssg div{ background:var(--soft); border-radius:10px; padding:10px 12px }
.ssg b{ display:block; font-family:var(--f-display); font-size:30px; line-height:1.1 }
.ssg small{ color:var(--muted); font-size:12px }
.plan-s{ display:grid; gap:6px; font-size:14px; margin-bottom:10px } .plan-s span{ display:flex; justify-content:space-between; color:var(--muted) } .plan-s b{ color:var(--ink) }
.flog{ list-style:none; margin:0; padding:0; display:grid; gap:2px }
.flog li{ display:grid; grid-template-columns:7.5em 9em 1fr; gap:10px; padding:7px 0; border-top:1px solid var(--line); font-size:13.5px; align-items:baseline }
.flog li:first-child{ border-top:none }
.flog i{ font-style:normal; color:var(--muted); font-size:12.5px } .flog span{ color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.flog li.good b{ color:var(--pitch) } .flog li.bad b{ color:var(--bad) } .flog li.gold b{ color:var(--gold) }
/* 訓練頁 */
.plist{ display:grid; gap:6px }
.prow{ display:grid; grid-template-columns:7em 1fr auto; gap:12px; align-items:center; text-align:left; background:var(--soft); border:1.5px solid transparent; border-radius:10px; padding:10px 14px; cursor:pointer }
.prow span{ color:var(--muted); font-size:13px } .prow em{ font-style:normal; font-size:12px; color:var(--muted) }
.prow[aria-pressed="true"]{ border-color:var(--ink); background:var(--card) } .prow[aria-pressed="true"] em{ color:var(--pitch); font-weight:700 }
/* 事件視窗 */
.modal{ position:fixed; inset:0; z-index:50; background:rgba(8,12,22,.6); display:grid; place-items:center; padding:24px }
.mbox{ width:min(780px,100%); max-height:calc(100vh - 48px); background:var(--paper); border-radius:18px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.35) }
.mhead{ padding:14px 22px; background:var(--bar); color:var(--bar-ink); font-weight:700; font-size:14px }
.mbody{ overflow:auto; padding:18px 22px 22px; scroll-behavior:smooth }
.mbody #feed{ display:grid; gap:12px }
.mbody #act{ display:grid; gap:8px; padding-top:14px }
.mdiv{ font-size:12.5px; font-weight:700; color:var(--muted); border-bottom:1px solid var(--line); padding:8px 0 4px }
.optgrid{ display:grid; gap:8px } .optgrid.cols{ grid-template-columns:repeat(auto-fit,minmax(210px,1fr)) }
.btn .rk{ font-style:normal; font-size:11px; font-weight:700; float:right; border-radius:99px; padding:1px 8px; margin-left:6px; background:var(--soft); color:var(--muted) }
.btn .rk-穩健{ color:var(--pitch) } .btn .rk-冒險{ color:var(--bad) } .btn .rk-招牌{ color:var(--gold) }
.card{ border-radius:12px }
/* 賽前 */
.card.prematch{ background:linear-gradient(120deg,#111A2E,#1B2A4A); color:#fff; border:none }
.card.prematch h4{ color:#FFD54A; font-size:13px }
.pm{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin:6px 0 10px }
.pm-team b{ display:block; font-size:20px; font-weight:900 } .pm-team small{ color:rgba(255,255,255,.65); font-size:12px } .pm-team.r{ text-align:right }
.pm-vs{ text-align:center; font-family:var(--f-display); font-size:26px; color:#FFD54A } .pm-vs small{ display:block; font-family:var(--f-body); font-size:11.5px; color:rgba(255,255,255,.7) }
.pm-chips{ display:flex; flex-wrap:wrap; gap:6px }
.pm-chips span{ font-size:12px; background:rgba(255,255,255,.12); border-radius:99px; padding:2px 10px }
.card:not(.prematch):not(.moment) .pm-chips span{ background:var(--soft) }
.vsbar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; background:rgba(255,255,255,.07); border-radius:10px; padding:8px 12px; margin:8px 0 }
.vsbar small{ display:block; font-size:11.5px; color:rgba(255,255,255,.65) } .vsbar b{ font-family:var(--f-display); font-size:28px; color:#7FB2FF } .vsbar .r{ text-align:right } .vsbar .r b{ color:#FF9A7F }
.vsbar i{ font-style:normal; font-weight:900; font-size:12px; background:#fff; color:#111A2E; border-radius:99px; padding:4px 7px }
/* 賽後戰報 */
.card.mreport{ padding:0; overflow:hidden; border:1px solid var(--line) }
.card.mreport h4{ padding:10px 16px; margin:0; background:var(--bar); color:var(--bar-ink); font-size:13px }
.card.mreport > div{ padding:12px 16px 14px }
.mr-head{ display:flex; align-items:center; gap:14px }
.mr-res{ font-weight:900; font-size:13px; border-radius:6px; padding:2px 10px; background:var(--soft) }
.mr-res.w{ background:var(--pitch); color:#fff } .mr-res.l{ background:var(--bad); color:#fff }
.mr-score{ flex:1; display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center }
.mr-score b{ font-size:15px } .mr-score b:last-child{ text-align:right } .mr-score strong{ font-family:var(--f-display); font-size:34px }
.mr-grid{ display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; margin:10px 0 }
.mr-rt{ text-align:center; background:var(--soft); border-radius:12px; padding:8px 14px } .mr-rt strong{ display:block; font-family:var(--f-display); font-size:34px; line-height:1 } .mr-rt small{ font-size:11.5px; color:var(--muted) }
.mr-rt.hi{ background:color-mix(in srgb,var(--pitch) 18%,var(--card)) } .mr-rt.lo{ background:color-mix(in srgb,var(--bad) 14%,var(--card)) }
.mr-st{ display:flex; gap:18px } .mr-st span{ font-size:12px; color:var(--muted) } .mr-st b{ display:block; font-family:var(--f-display); font-size:24px; color:var(--ink) }
.mr-motm{ text-align:right; background:color-mix(in srgb,var(--bib) 16%,var(--card)); border:1px solid var(--bib); border-radius:10px; padding:6px 12px } .mr-motm small{ display:block; font-size:11px; color:var(--muted) }
.card.mreport h5{ margin:10px 0 4px; font-size:13px }
.mr-log{ list-style:none; margin:0; padding:0; display:grid; gap:4px; font-size:13px }
.mr-log li{ display:grid; grid-template-columns:2.6em 7.5em 1fr auto; gap:8px; align-items:baseline; padding:5px 8px; background:var(--soft); border-radius:8px }
.mr-log i{ font-style:normal; color:var(--muted) } .mr-log span{ color:var(--muted) } .mr-log em{ font-style:normal; font-weight:700; font-size:12px } .mr-log em.ok{ color:var(--pitch) } .mr-log em.ng{ color:var(--bad) }
.mr-media{ font-size:13px; color:var(--muted); font-style:italic }
@media (max-width: 980px){
  #game{ grid-template-columns:1fr }
  .side{ position:static; height:auto }
  .span4,.span5,.span6,.span7,.span8{ grid-column:span 12 }
  .gmain{ padding:16px }

/* ---------- 設定 ---------- */

.seg button[aria-pressed="true"]{ border-color:var(--bib); background:color-mix(in srgb, var(--bib) 20%, var(--card)); font-weight:800 }
.start-set{ display:flex; justify-content:flex-end; margin:12px 0 4px } .start-set .btn{ width:auto }

.mk{ display:grid; gap:6px }

.lv1{ background:color-mix(in srgb, var(--bib) 35%, var(--card)) } .lv2{ background:var(--pitch); color:#fff }

.bad-t{ color:var(--bad); font-weight:700 }

  S.flags.firstGr = S.gr;
  logLine(`${S.year} 年 9 月，${S.age} 歲，在${CITIES[S.city].n}加入${S.gr}。`);

}
const leadAdj0 = cfg => cfg.posTrait==='leader' ? 8 : cfg.negTrait==='selfish' ? -10 : 0;
const leadAdj = () => S.posTrait==='leader' ? 8 : S.negTrait==='selfish' ? -6 : 0;

/* ---------- 同屆 NPC ---------- */
function makeNpc(st, clubId, tag){
  const pos = pick(POS_ORDER), pot = clamp(st==='GR' ? 50 + N0(11) : 54 + N0(9), 32, 95);
  const rel = ri(0,11)/12, mat = pick(['early','norm','norm','late']);
  const base = st==='GR' ? r1(ri(8,14)+pot*0.05) : r1(E(S.age)*CAT_F[club(clubId)?.cat||2]*rf(0.86,1.05)/physF(S.age,rel,mat));
  return { n:npcName(), pos, pot:r1(pot), ab:base, rate:r1(rf(0.8,1.2)), rel, mat, st, club:clubId, tag, note:'', hist:[] };
}
function npcPerf(n, age){ return n.ab*(0.75+0.25*physF(age,n.rel,n.mat)); }
function npcNote(n, t){ n.note = t; n.hist.push(`${S.age} 歲：${t}`); }
function updateCohort(){
  const news = [], age = S.age;
  S.cohort.forEach(n => {
    if(n.st==='QUIT') return;
    n.ab = Math.min(99, n.ab + ageEff(age)*n.rate*Math.max(0,(n.pot-n.ab)/n.pot)*5.6 + rf(-0.6,0.6));
    const p = npcPerf(n, age);
    if(n.st==='GR'){
      if(age>=7 && age<=14){ const thr = E(age)*CAT_F[3]; if(p > thr*rf(0.95,1.08) && chance(35)){ const opts = nearAcademies(age>=11); if(opts.length){ const c = pick(opts); n.st='ACA'; n.club=c.id; npcNote(n, `加入${c.n}學院`); news.push(`${n.n}加入${c.n}學院。`); } } }
      if(age>=13 && chance(12)){ n.st='QUIT'; npcNote(n,'不再參加有組織足球'); news.push(`${n.n}決定不再踢球，專心讀書。`); }
      if(age===15 && n.st==='GR'){ if(p>E(age)*0.75 && chance(40)){ n.st='NON'; n.club=pick(clubsIn('NON')).id; npcNote(n,`加入非聯賽球會${cName(n.club)}青年隊`); } else { n.st='QUIT'; npcNote(n,'畢業後不再踢球'); } }
    } else if(n.st==='ACA'){
      const c = club(n.club), thr = E(age)*CAT_F[c.cat||3];
      const review = [8,9,10,12,15].includes(age);
      if(review && p < thr*rf(0.9,1.02)){
        if(age===15){ if(chance(45)){ n.st='NON'; n.club=pick(clubsIn('NON')).id; npcNote(n,`16 歲未獲 Scholarship，加入非聯賽球會${cName(n.club)}`); } else { n.st='QUIT'; npcNote(n,'16 歲被放棄，轉讀 college'); } }
        else { n.st='GR'; npcNote(n,`${age+1} 歲被${c.n}放棄`); }
        news.push(`${n.n}被${c.n}放棄。`);
      } else if(age===15){ n.st='SCH'; npcNote(n,`獲${c.n} Scholarship`); news.push(`${n.n}獲${c.n}簽下 Scholarship。`); }
    } else if(n.st==='SCH'){
      if(age===17){ const c = club(n.club); if(p > E(17)*CAT_F[c.cat||3]*rf(0.9,1.04)){ n.st='PRO'; npcNote(n,`與${c.n}簽訂職業合約`); news.push(`${n.n}與${c.n}簽訂職業合約。`); } else if(chance(35)){ n.st='PRO'; n.club=npcClubFor(n.ab-3); npcNote(n,`被放棄後轉投${cName(n.club)}`); news.push(`${n.n} 18 歲被放棄，轉投${cName(n.club)}。`); } else { n.st='NON'; n.club=pick(clubsIn('NON')).id; npcNote(n,`18 歲被放棄，加入非聯賽球會${cName(n.club)}`); news.push(`${n.n} 18 歲被放棄，降落非聯賽。`); } }
    } else if(n.st==='PRO' || n.st==='NON'){
      if(age>=33 && chance(25+(age-33)*15)){ n.st='QUIT'; npcNote(n,`${age} 歲退役`); news.push(`${n.n}宣布退役。`); return; }
      if(age>=30) n.ab -= rf(0.5,2.2);
      if(chance(30)){ const nc = npcClubFor(n.ab); if(nc!==n.club){ const up = LG[club(nc).lg].lvl < LG[club(n.club).lg].lvl; n.club = nc; n.st = club(nc).lg==='NON'?'NON':'PRO'; npcNote(n,`轉會至${cName(nc)}（${LG[club(nc).lg].short}）`); if(up && club(nc).lg==='PL') news.push(`${n.n}轉會至英超球會${cName(nc)}。`); } }
    }
  });
  return news;
}
function npcClubFor(ab){ const lg = LG_ORDER.find(l => ab >= LG[l].par+1) || 'NON'; return pick(clubsIn(lg)).id; }
function npcStatusTxt(n){
  const m = { GR:'草根球會', ACA:`${cName(n.club)}學院`, SCH:`${cName(n.club)}學徒`, PRO:`${cName(n.club)}（${n.club?LG[club(n.club).lg].short:''}）`, NON:`${cName(n.club)}（非聯賽）`, QUIT:'已離開足球' };

function regionsInRange(wide){ const c = CITIES[S.city]; return wide ? [...c.near, ...c.mid] : c.near.length ? c.near : c.mid; }
function nearAcademies(wide){ const rs = regionsInRange(wide ?? S.age>=11); return Object.values(S.W.clubs).filter(c => c.cat>0 && rs.includes(c.reg)); }
function isFar(c){ return !CITIES[S.city].near.includes(c.reg); }
function altPos(){
  const bp = bestPositions().filter(([p]) => p!==S.pos);
  const best = bp[0]; if(!best) return null;
  return best[1] > ovrAt(S.pos)*1.04 ? best[0] : null;
}

/* ---------- 裝備與訓練資源 ---------- */
function itemPassives(){
  if(!S.items) S.items = {};
  SHOP.forEach(x => { if(!S.items[x.id] || !x.per) return; for(const k in x.per){ if(k==='weak') train(weakestKey(), x.per[k]); else train(k, x.per[k]); } if(x.fat) fx({ fat:x.fat }); });
}
function shopAvail(){ return SHOP.filter(x => !S.items[x.id] && (!x.min||S.age>=x.min) && (!x.max||S.age<=x.max) && !(S.stage==='SCH' && ['futsal','camp'].includes(x.id))); }
function shopStep(next){
  if(!S.items) S.items = {};
  if(S.term!==0 || S.age>17) { next(); return; }
  const list = shopAvail().filter(x => x.p <= S.money);
  if(!list.length){ next(); return; }
  const owned = SHOP.filter(x=>S.items[x.id]).map(x=>x.n);
  UI.card('', '新學年・購買裝備', `你有 <b>£${S.money}</b> 零用錢。${owned.length?`已擁有：${owned.join('、')}。`:''}<br><span class="hint">年費項目將於翌年 9 月到期。</span>`);
  const loop = () => {
    const l = shopAvail().filter(x => x.p <= S.money);
    if(!l.length){ next(); return; }
    UI.choose(`想購買甚麼？（餘額 £${S.money}）`, [ ...l.map(x => ({ t:`${x.n}・£${x.p}`, s:`${x.d}${x.yr?'｜一年':''}`, f:()=>{ S.money -= x.p; S.items[x.id] = 1; logLine(`${S.age} 歲購買${x.n}`); UI.card('good', x.n, `已購買！${x.d}。`); loop(); } })),
      { t:'不再購買，保留餘款', main:true, f:next } ]);
  };

}

/* ---------- 隨機事件 ---------- */
/* 連鎖事件到期時一定觸發 */
const dueChain = () => (S.evq||[]).find(q => q.t <= (S.tc||0) && EVENTS.some(e => e.id===q.id && e.st.includes(S.stage) && S.age>=e.a[0] && S.age<=e.a[1]));
function maybeEvent(p){ return next => { if(!dueChain() && !chance(p)) { next(); return; } runEvent(next); }; }
function runEvent(next){
  const due = dueChain();
  let e;
  if(due){ S.evq = S.evq.filter(q => q!==due); e = EVENTS.find(x => x.id===due.id); }
  else { const pool = EVENTS.filter(e => !e.chain && e.st.includes(S.stage) && S.age>=e.a[0] && S.age<=e.a[1] && (!e.c || e.c()) && !S.seen.slice(-14).includes(e.id));
    e = wpick(pool, x => typeof x.w==='function' ? x.w() : (x.w||1)); }
  if(!e){ next(); return; }
  S.seen.push(e.id);
  UI.card('event', e.t, e.d());
  const opts = e.o().filter(o => !o.c || o.c());
  UI.choose('你會如何選擇？', opts.map(o => ({ t:o.t, s:o.s, f:() => resolveOpt(o, e, next) })));
}
function resolveOpt(o, e, next){
  if(o.f){ o.f(() => { o.f2 && o.f2(); next(); }); return; }
  let res = o;
  if(o.p!=null){ const p = typeof o.p==='function' ? o.p() : o.p; res = chance(p) ? o.ok : o.ng; }
  const rel = (REL_FX[e.id]||{})[o.t], t = [fx(res.fx||{}), rel ? fx(rel) : ''].filter(Boolean).join('、'); o.f2 && o.f2();
  UI.card(res===o.ng?'bad':'', o.t, `${res.r||''}${t?`<div class="fx">${t}</div>`:''}`);
  next();
}

/* ---------- 青訓學期：開始（保留學期事件）、比賽、結束 ---------- */
function youthStart(sl, next){
  S.money += ALLOW[S.wealth];
  if(S.term===0) S.ss = { app:0, g:0, a:0, cs:0, rt:0 };
  if(S.parent==='study') fx({study:2});
  if(S.parent==='pushy' && S.stage!=='SCH') fx({fam:-1, love:-1});
  runSeq([termIntro, shopStep, maybeEvent(85)], next);
}
function youthEnd(sl, next){

}
function coachLine(){

function settleMeters(){ S.m.conf = Math.round(S.m.conf + (55 - S.m.conf)*0.12); S.m.love = Math.round(S.m.love + (62 - S.m.love)*0.06); }
function termEnd(next){

    UI.choose('怎麼辦？', [

/* ---------- 學年終結 ---------- */
function gradeOf(v, ref){ const r = v/ref; return r>=1.18?'A+':r>=1.07?'A':r>=0.97?'B':r>=0.87?'C':r>=0.77?'D':'E'; }
function reportCard(){

function yearEndYouth(done){

/* 草根期：球探邀請 */
function grassrootsYearEnd(next){
  const a = S.age;
  if(a<=6){ if(S.m.scout>=22 && !S.devc){ const c = pick(nearAcademies(false).filter(x=>x.cat<=2).length?nearAcademies(false).filter(x=>x.cat<=2):nearAcademies(true)); if(c){ S.devc = c.id; UI.card('good','發展中心', `${c.n}的球探看了你幾場比賽，邀請你參加他們的預備學院發展中心，逢星期六訓練。`); logLine(`加入${c.n}發展中心`); } } next(); return; }
  if(a>=15){ sixteenNoScholar(next); return; }
  const cands = nearAcademies(a>=10);

function joinAcademy(c){

  /* 學院同屆 */
  S.cohort = S.cohort.filter(n => n.st!=='ACA' || n.club!==c.id);
  for(let i=0;i<7;i++) S.cohort.push(makeNpc('ACA', c.id, i===0 && !S.cohort.some(n=>n.tag==='rival') ? 'rival' : null));
  S.cohort.forEach(n => { if(n.tag==='rival' && !n.posFix){ n.pos = S.pos; n.posFix = 1; } });

}

/* ================= 職業生涯（包括非聯賽） ================= */
const GAME_VER = '0.8.0';
const ROLES = ['主力','輪換','替補','未入名單'];
const ROLE_MUL = [1, 0.6, 0.3, 0.1];

const curClub = () => S.pro ? (S.pro.loan ? S.pro.loan.club : S.pro.club) : null;
const curLg = () => S.pro ? club(curClub()).lg : null;

function wageFor(cid, o){
  const c = club(cid), L = LG[c.lg], v = o ?? ovr();
  const w = L.wage * clamp(1 + (v - c.str)*0.09, 0.35, 3.2) * (S.age<20?0.55:S.age<22?0.8:1) * (1 + agentWage());
  return Math.max(50, Math.round(w/50)*50);
}
const money = n => n>=1e6 ? `£${(n/1e6).toFixed(n>=1e7?0:1)}m` : n>=1e3 ? `£${Math.round(n/1e3)}k` : `£${n}`;
function startPro(cid, opts={}){
  S.stage = 'PRO';
  S.pro = { club:cid, loan:null, cyrs:opts.yrs||2, wage:0, trust:45+leadAdj(), semi:!!opts.semi, clubYrs:{}, captain:false, lastRt:0, debut:false };
  S.pro.wage = wageFor(cid); mgrOf(cid); S.pro.num = numFor(cid); S.pro.numClub = cid;
}
function roleCalc(){
  const c = club(curClub()), diff = ovr() - c.str + footEdge() + (S.pro.trust-50)/10 + (S.pro.captain?1:0) - (S.age<18?4:0) + clamp(styleFit(c.id)*0.3, -2, 2);
  /* 門將只有一個正選位置：不是正選就是後備，很少輪換 */
  let r = S.pos==='GK' ? (diff>=2?0 : diff>=-3?2 : 3) : diff>=3?0 : diff>=-1.5?1 : diff>=-5?2 : 3;
  return { r, dev: r===3 && S.age<=21 && !S.pro.semi && c.cat>0 };
}
function roleTxt(){ const s = S.season; return s.dev ? `預備組（${curLg()==='PL'?'PL2・U21':'U21 預備組'}）` : ROLES[s.r]; }

/* 職業期：季前（預備）、上半季開始、半季結束 */
function proStart(sl, next){
  if(S.term===2){ janWindow(next); return; }
  Object.assign(S.season, roleCalc());
  UI.card('', '上半季開始', `${cName(curClub())}・${LG[curLg()].n}｜角色：<b>${roleTxt()}</b>｜主帥信任 ${Math.round(S.pro.trust)}`);

function proEnd(sl, next){

}
function preseason(next){
  S.season = { mo:0, mg:0, ma:0, inj:0, fd:0 };
  S.recent = [];
  const c = club(curClub());
  /* 老化 */
  if(S.age>=30){ const dn = [];
    ATTRS.forEach(k => { const kd = ATTR_KIND[k]; let d = 0;
      if(kd==='P') d = rf(0.8,2.2) + (S.age-30)*0.45; else if(kd==='T' && S.age>=32) d = rf(0.3,1.2) + (S.age-32)*0.3; else if(kd==='M' && S.age>=34) d = rf(0.2,0.8);
      if(S.pers.disc>=4) d *= 0.8;
      if(hasLife('cryo')) d *= 0.85;
      if(hasPerk('vet')) d *= 0.7;
      if(S.pos==='GK') d *= 0.55;   /* 門將衰退較慢 */
      if(d>0){ S.ab[k] = Math.max(1, S.ab[k]-d); if(d>=1.2) dn.push(ATTR_N[k]); } });
    if(S.age<=33) ATTRS.filter(k=>ATTR_KIND[k]==='M').forEach(k => train(k, 1.5));
    if(dn.length) UI.card('bad','歲月', `${S.age} 歲。季前體能測試顯示你的${dn.join('、')}下降了。你開始要依靠經驗比賽。`); }
  /* 換帥 */
  mgrOf(c.id);
  if(chance(12) && S.pro.clubYrs[curClub()]){ S.pro.trust = 45; c.mgr = newMgr(); const st = MSTYLE[c.mgr.st]; UI.card('event','換帥', `${c.n}聘請了新主帥${c.mgr.n}。他主張<b>${st.n}</b>：${st.d}。<br>你與新主帥的戰術契合度：<b>${fitN(styleFit(c.id))}</b>。所有人都要重新證明自己。`); }
  /* 隊長 */
  const rc0 = roleCalc();
  if(!S.pro.captain && !S.pro.loan && S.age>=25 && (S.pro.clubYrs[S.pro.club]||0)>=3 && rc0.r===0 && chance(40)){ S.pro.captain = true; UI.card('gold','隊長', `主帥把隊長臂章交給你。`); logLine(`${S.age} 歲成為${c.n}隊長`); }
  Object.assign(S.season, roleCalc());
  const cTxt = S.pro.loan ? `外借自${cName(S.pro.club)}，至季尾` : `合約尚餘 ${S.pro.cyrs} 年｜週薪 ${money(S.pro.wage)}`;
  UI.card('', `${S.year} 年夏天・${S.age} 歲`, `${c.n}（${LG[c.lg].n}）｜${cTxt}<br>季前預計角色：<b>${roleTxt()}</b><br>主帥${c.mgr?c.mgr.n:''}：${fitTxt(c.id)}${S.pro.semi?'<br>半職業球員：日間上班，晚上訓練。':''}`);
  fx({ fat:-25 });
  S.ss = { app:0, g:0, a:0, cs:0, rt:0 };
  seasonTableInit(); migrateAgent(); lifeRenew();
  if(!S.pro.semi) setObjectives();
  if(hasPerk('leader')){ S.pro.trust = clamp(S.pro.trust+4, 0, 100); S.m.mates = clamp((S.m.mates||50)+4, 0, 100); }
  runSeq([rivalPreseason, clubNews, brandStep, maybeEvent(55)], next);
}
function termEndPro(next){
  settleMeters();

/* ---------- 一月轉會窗 ---------- */
function loanOffers(n){
  const o = ovr(), c = club(S.pro.club);
  const cands = Object.values(S.W.clubs).filter(x => x.id!==c.id && x.lg!=='NON' && LG[x.lg].lvl > LG[c.lg].lvl && x.str <= o+1.5 && x.str >= o-9 && o >= LG[x.lg].par-6);
  return shuffle(cands).slice(0, n);
}
function janWindow(next){
  const se = S.season;
  Object.assign(se, roleCalc());
  if(S.pro.loan || S.age>22 || se.r<2 || S.pro.semi){ next(); return; }
  const offs = loanOffers(S.flags.wantLoan ? ri(2,3) : ri(1,3)); S.flags.wantLoan = 0;

  return { sc, tier, pl, cs };
}
function endGame(reason){
  S.endReason = reason; logLine(reason);
  afterCareer(() => { S.done = true; checkAch(); UI.save(); UI.end(evaluate()); });
}

/* ================= 行事曆、訓練計劃、比賽、聯賽積分榜 =================
   遊戲以「推進」逐件事前進：每個學期／半季是一張行事曆（S.cal），由開始、比賽、事件、結束組成。
   兩件事之間按訓練計劃自動訓練。 */

const TERM_WEEKS_Y = [14, 12, 12];     /* 秋季、春季、夏季學期 */
const TERM_WEEKS_P = [6, 20, 20];      /* 季前、上半季、下半季 */
const isYouth = () => ['GR','ACA','SCH'].includes(S.stage);
const termWeeks = () => (isYouth() ? TERM_WEEKS_Y : TERM_WEEKS_P)[S.term];

/* 現時日期：例如「2026 年 10 月」 */
function slotDate(wk){
  const w = wk ?? S.wk ?? 0, youth = isYouth();
  const m0 = youth ? [9,1,4][S.term] : [7,8,1][S.term];
  let y = S.year + ((youth ? S.term>0 : S.term===2) ? 1 : 0), m = m0 + Math.floor(w/4.35);
  if(m>12){ m -= 12; y++; }
  return `${y} 年 ${m} 月`;
}

/* ---------- 訓練計劃 ---------- */
const PLAN_OUT = [
  { id:'pos', n:'位置專項', d:'按你位置的關鍵能力平均分配' },
  { id:'sho', n:'射門', w:{ sho:1, tec:.3 } },
  { id:'pas', n:'傳球', w:{ pas:1, iq:.3 } },
  { id:'tec', n:'盤帶技術', w:{ tec:1, pac:.2 } },
  { id:'def', n:'防守', w:{ def:1, iq:.3 } },
  { id:'hea', n:'頭球對抗', w:{ hea:1, str:.3 }, min:9 },
  { id:'pac', n:'速度', w:{ pac:1, sta:.3 } },
  { id:'phy', n:'體能力量', w:{ sta:.7, str:.7 }, min:11 },
  { id:'iq',  n:'戰術閱讀', w:{ iq:1, def:.2, pas:.2 } }
];
const PLAN_GK = [
  { id:'pos', n:'位置專項', d:'按門將的關鍵能力平均分配' },
  { id:'gks', n:'撲救反應', w:{ sho:1, pac:.3 } },
  { id:'gkh', n:'接球', w:{ tec:1, sho:.2 } },
  { id:'gka', n:'制空', w:{ hea:1, str:.3 }, min:9 },
  { id:'gkd', n:'腳下出球', w:{ pas:1, tec:.2 } },
  { id:'gkp', n:'站位指揮', w:{ def:.7, iq:.7 } },
  { id:'gke', n:'爆發力量', w:{ pac:.8, str:.6 }, min:11 }
];
const INTENSITY = {
  light:{ n:'輕鬆', d:'成長較慢，疲勞恢復較多', g:0.7, fat:14, love:1, inj:-1 },
  normal:{ n:'正常', d:'均衡的訓練節奏', g:1, fat:30, love:0, inj:0 },
  hard:{ n:'加練', d:'成長較快；疲勞累積、熱誠下降、受傷風險上升', g:1.3, fat:52, love:-2, inj:2 }
};
/* 課餘時間：數值為每個學期／半季的總效果 */
const OFFTIME = [
  { id:'balance', n:'均衡生活', d:'讀書、家庭、朋友兼顧', fx:{ study:2, fam:3, love:3 } },
  { id:'study',   n:'專心學業', d:'學業↑↑、熱誠↓', fx:{ study:10, love:-3 }, max:17 },
  { id:'family',  n:'陪伴家人', d:'家庭↑↑、疲勞↓', fx:{ fam:9, fat:-6 } },
  { id:'friends', n:'與朋友玩', d:'熱誠↑↑、學業↓', fx:{ love:8, study:-4 } },
  { id:'sport',   n:'其他運動', d:'體能、速度小幅提升；熱誠↑', fx:{ love:4 }, tr:{ sta:1.2, pac:0.8 }, max:13 },
  { id:'extra',   n:'額外練球', d:'訓練成長 +25%；熱誠↓、疲勞↑', fx:{ love:-4 }, gmul:1.25, fatAdd:8 },
  { id:'rest',    n:'休息恢復', d:'疲勞大幅恢復、熱誠↑', fx:{ love:3 }, fatAdd:-10, min:16 }
];
const planList = () => (S.pos==='GK' ? PLAN_GK : PLAN_OUT).filter(p => !p.min || S.age>=p.min);
const offList = () => OFFTIME.filter(o => (!o.min||S.age>=o.min) && (!o.max||S.age<=o.max));
function defaultPlan(){ return { focus:'pos', int:'normal', off:'balance' }; }
function planWeights(id){
  const p = (S.pos==='GK' ? PLAN_GK : PLAN_OUT).find(x => x.id===id);
  if(!p || !p.w){ const w = {}; keyAttrs().slice(0,4).forEach(k => w[k] = 1); return w; }
  return p.w;
}
function fixPlan(){
  if(!S.plan) S.plan = defaultPlan();
  if(!planList().some(p => p.id===S.plan.focus)) S.plan.focus = 'pos';
  if(!offList().some(o => o.id===S.plan.off)) S.plan.off = S.age>=16 ? 'rest' : 'balance';
}
/* 量表的小數累積，避免每星期的小改變被四捨五入吃掉 */
function addMeter(k, v){ S.acc = S.acc || {}; S.acc[k] = (S.acc[k]||0) + v; const n = Math.trunc(S.acc[k]); if(n){ S.acc[k] -= n; S.m[k] = clamp(S.m[k] + n, 0, 100); } }
const TRAIN_BASE = { GR:1.3, ACA:1.4, SCH:1.8, PRO:1.8 };
function planTick(weeks){
  if(!weeks || weeks<=0 || S.done) return;
  fixPlan();
  const f = weeks/termWeeks(), P = S.plan, I = INTENSITY[P.int], O = OFFTIME.find(o => o.id===P.off) || OFFTIME[0];
  const youth = isYouth(), injured = S.inj && S.inj.w>0;
  /* 個人訓練計劃 */
  const base = (S.stage==='PRO' && S.pro && S.pro.semi ? 2.4 : TRAIN_BASE[S.stage]) * 2.4;
  const w = planWeights(P.focus), tot = Object.values(w).reduce((a,b)=>a+b,0);
  const mul = base * I.g * (O.gmul||1) * (hasLife('ptc')?1.15:1) * dif().train * f * (injured ? 0.4 : 1);
  for(const k in w) train(k, mul * w[k]/tot);
  if(O.tr) for(const k in O.tr) train(k, O.tr[k]*f);
  /* 學院／學徒的固定訓練、自然成長 */
  if(S.stage==='ACA' || S.stage==='SCH'){
    const sch = S.stage==='SCH';
    keyAttrs().forEach((k,i) => train(k, ((sch?3.6:2.4) - i*0.25)*f));
    ATTRS.forEach(k => train(k, (sch?1.1:0.6)*f));
    playPos(S.pos, (sch?0.1:0.07)*f);
    if(S.stage==='ACA' && S.flags.far){ addMeter('fat', 4*f); addMeter('study', -2*f); }
  } else if(youth) playPos(S.pos, 0.04*f);
  if(youth) naturalGrowth(f*(S.stage==='ACA'?1.05:S.stage==='SCH'?1.1:1));
  if(S.devc && S.stage==='GR'){ train('tec',1.5*f); train('pas',1*f); }
  /* 量表 */
  for(const k in O.fx) if(k in S.m && !(k==='study' && !youth)) addMeter(k, O.fx[k]*f);
  if(youth) addMeter('study', (50 - S.m.study)*0.08*f);
  addMeter('love', I.love*weeks/4 + (S.m.love>60 ? -4*f : 0));
  const target = clamp(I.fat + (O.fatAdd||0) + (S.stage==='SCH'?6:0) + (S.pro&&S.pro.semi?6:0) - (hasLife('nutri')?5:0), 5, 90);
  /* 職業期：薪金扣除稅項與生活開支、經紀人佣金後存入存款 */
  if(S.stage==='PRO' && S.pro){ const a = agentOf(); S.money = (S.money||0) + Math.round(S.pro.wage*weeks*0.45*(1-(a?a.fee:0))*(S.pro.loan?0.8:1)); }
  if(hasLife('analyst')) train('iq', 1.2*f); if(hasLife('ptc')){ train('sta', 0.8*f); train('str', 0.8*f); }
  if(hasLife('psych')) addMeter('conf', (55 - S.m.conf)*0.15*f);
  S.m.fat = Math.round(S.m.fat + (target - S.m.fat)*(1 - Math.pow(0.82, weeks)));
  /* 傷患復原 */
  if(S.inj && S.inj.w>0){ S.inj.w = Math.max(0, S.inj.w - Math.round(weeks*(hasLife('cryo')?1.4:1))); if(S.inj.w===0){ UI.card('good','傷癒復出', '你終於可以重返球場。'); } }
}

/* ---------- 行事曆 ---------- */
/* 每個學年／賽季開始記錄一次能力評估，供成長曲線使用 */
function recordGrowth(){ S.grow = S.grow || []; if(!S.grow.length || S.grow.at(-1).age !== S.age) S.grow.push({ age:S.age, v:Math.round(ovr()) }); else S.grow.at(-1).v = Math.round(ovr()); }
function newTerm(){
  if(S.m.mates==null) S.m.mates = 50; if(S.m.fans==null) S.m.fans = 20;
  S.gain = {}; S.mStart = { ...S.m }; S.tmp = S.tmp || {}; S.tc = (S.tc||0) + 1;
  /* 隊友關係影響主帥信任；球迷人氣慢慢回落 */
  if(S.pro && !S.pro.semi){ if(S.m.mates>=70) S.pro.trust = clamp(S.pro.trust+1,0,100); if(S.m.mates<=30) S.pro.trust = clamp(S.pro.trust-1,0,100); }
  S.m.fans = Math.round(S.m.fans + ((S.stage==='PRO' ? 30 : 15) - S.m.fans)*0.06);
  setAttrSet(S.pos==='GK'); fixPlan();
  buildCal();
}
function buildCal(){
  const cal = [], W = termWeeks();
  if(isYouth()){
    const nM = S.stage==='SCH' ? 4 : 3, evAt = chance(S.stage==='GR'?30:45) ? ri(0, nM-2) : -1;
    cal.push({ k:'start', wk:0 });
    for(let i=0;i<nM;i++){ cal.push({ k:'match', wk:Math.round(W*(i+0.7)/(nM+0.4)), fx:youthFixture() }); if(i===evAt) cal.push({ k:'event' }); }
    cal.push({ k:'end', wk:W });
  } else if(S.term===0){
    cal.push({ k:'pre', wk:0 }, { k:'match', wk:4, friendly:true }, { k:'end', wk:W });
  } else {
    const n = 5, evAt = chance(S.term===1?70:60) ? ri(1, n-2) : -1;
    cal.push({ k:'start', wk:0 });
    for(let i=0;i<n;i++){ cal.push({ k:'match', wk:Math.round(W*(i+0.6)/(n+0.2)), p:(S.term-1)*0.5 + 0.5*(i+0.5)/n }); if(i===evAt) cal.push({ k:'event' }); }
    cal.push({ k:'end', wk:W });
  }
  /* 事件沒有固定日期：沿用前一件事的日期 */
  cal.forEach((s,i) => { if(s.wk==null) s.wk = i ? cal[i-1].wk : 0; });
  S.cal = cal; S.ci = 0; S.wk = 0;
}
const SLOTS = {
  start: (sl, next) => isYouth() ? youthStart(sl, next) : proStart(sl, next),
  pre:   (sl, next) => preseason(next),
  match: (sl, next) => isYouth() ? youthMatch(sl, next) : proFixtureRun(sl, next),
  event: (sl, next) => runEvent(next),
  end:   (sl, next) => isYouth() ? youthEnd(sl, next) : proEnd(sl, next)
};
const nextSlot = () => S && S.cal ? S.cal[S.ci] : null;
/* 推進至下一件事 */
function advance(){
  if(!S || S.done || S.busy) return false;
  if(!S.cal || !S.cal[S.ci]) newTerm();
  S.busy = true;
  UI.newPage(`${slotDate(S.cal[S.ci].wk)}・${pageTitle()}`);
  runSlot(() => { S.busy = false; const pk = checkPerks(); pk.forEach(p => UI.card('gold', `解鎖特技：${p.n}`, `${p.d}。<br><span class="hint">條件：${p.need}</span>`)); const got = checkAch(); if(got.length) UI.card('gold', '成就解鎖', got.map(n => `★ ${n}`).join('<br>')); recordGrowth(); UI.idle(); });
  return true;
}
/* 執行一件事；學期／半季結束後，緊接執行下一個學期的開始，減少按鍵次數 */
function runSlot(done){
  const sl = S.cal[S.ci];
  planTick(Math.max(0, sl.wk - S.wk)); S.wk = Math.max(S.wk, sl.wk);
  SLOTS[sl.k](sl, () => {
    if(S.done) return;
    if(sl.k==='end'){
      if(S.term < 2) S.term++; else { S.term = 0; S.age++; S.year++; }
      newTerm();
      UI.newPage(`${slotDate(0)}・${pageTitle()}`);
      runSlot(done); return;
    }
    S.ci++;
    done();
  });
}

/* ---------- 比賽 ---------- */
function poisson(l){ let k = 0, p = 1; const L = Math.exp(-l); do { k++; p *= R(); } while(p > L && k < 12); return k-1; }
/* 青訓比賽的對手（建立行事曆時決定，方便主頁預告） */
function youthFixture(){
  const a = S.age;
  if(S.stage==='GR') return { tag: a<=10 ? `${ageGroup(a)} ${pick(['星期日聯賽','足球節盃賽','友誼賽'])}` : `${ageGroup(a)} 星期日聯賽`, home:S.gr, opp:pick(CITIES[S.city].gr.filter(x=>x!==S.gr)), lvl:E(a)*0.78, diff:r1(rf(-5,5)), n:2 };
  if(S.stage==='ACA'){ const o = pick(nearAcademies(true).filter(c=>c.id!==S.aca.club)) || pick(clubsIn('CH'));
    return { tag:`${ageGroup(a)} 學院賽`, home:`${cName(S.aca.club)} ${ageGroup(a)}`, opp:`${o.n} ${ageGroup(a)}`, oppId:o.id, lvl:E(a)*CAT_F[S.aca.cat]*rf(0.95,1.05), diff:r1((S.W.clubs[S.aca.club].str - o.str)*0.3 + rf(-3,3)), n:2 }; }
  const cup = S.term===1 && chance(40), o = pick(Object.values(S.W.clubs).filter(c=>c.cat>0&&c.cat<=2&&c.id!==S.aca.club));
  return { tag: cup?'FA Youth Cup':'U18 英超聯', home:`${cName(S.aca.club)} U18`, opp:`${o.n} U18`, oppId:o.id, lvl:E(a)*0.97, diff:r1((S.W.clubs[S.aca.club].str - o.str)*0.3 + rf(-3,3)), stake:cup?2:1, n:3 };
}
function youthMatch(sl, next){
  const f = sl.fx;
  playMatch({ tag:f.tag, home:f.home, opp:f.opp, lvl:f.lvl, diff:f.diff, stake:f.stake||1, youth:true, n:f.n }, next);
}
/* 職業比賽的對手：如外借後聯賽改變，重新抽選 */
function fixtureOpp(sl){
  const c = club(curClub());
  if(sl.friendly){ if(!sl.opp || !S.W.clubs[sl.opp]) sl.opp = pick(Object.values(S.W.clubs).filter(x => x.id!==c.id && Math.abs(LG[x.lg].lvl-LG[c.lg].lvl)<=1)).id; return { o:club(sl.opp) }; }
  if(!sl.opp || club(sl.opp).lg!==c.lg || sl.opp===c.id){
    const d = DERBIES.find(x => (x[0]===c.id||x[1]===c.id) && club(x[0]===c.id?x[1]:x[0]).lg===c.lg);
    if(d && chance(18)){ sl.opp = d[0]===c.id?d[1]:d[0]; sl.derby = d[2]; }
    else { sl.opp = pick(clubsIn(c.lg).filter(x=>x.id!==c.id)).id; sl.derby = null; }
  }
  return { o:club(sl.opp), derby:sl.derby };
}
function proFixtureRun(sl, next){
  const se = S.season, c = club(curClub()), lg = LG[c.lg];
  if(!sl.friendly) leagueAdvance(sl.p);
  const { o, derby } = fixtureOpp(sl);
  const lvlFirst = (o.str + lg.par)/2;
  const leagueGame = !sl.friendly;
  const done = r => { if(leagueGame && r && r.league) leagueForced(c.lg, c.id, o.id, r.gf, r.ga); else if(leagueGame) leagueRoundFor(c.lg); next(); };
  const rested = () => { UI.card('bad','傷停', `你仍在養傷（尚餘 ${S.inj.w} 星期），只能看着隊友對${o.n}。`); done(null); };
  if(S.inj && S.inj.w>0){ if(S.inj.w<=3 && !sl.friendly && !se.dev && se.r<=1 && (derby || isRivalClub(o.id) || chance(25))){ playHurt(derby || `對${o.n}的宿敵對決`, () => proPlay(sl, se, c, lg, o, derby, lvlFirst, done), rested); return; } rested(); return; }
  proPlay(sl, se, c, lg, o, derby, lvlFirst, done);
}
function proPlay(sl, se, c, lg, o, derby, lvlFirst, done){
  if(sl.friendly){ playMatch({ tag:'季前熱身賽', home:c.n, opp:o.n, lvl:lvlFirst, diff:c.str-o.str, stake:1, youth:false, n:2, friendly:true }, done); return; }
  if(se.dev){
    if(!S.pro.debut && chance(16) && ovr() >= c.str-9){
      const gkx = S.pos==='GK';
      UI.card('gold','一隊傷兵', gkx ? `正選門將與後備門將同時受傷，主帥在賽前告訴你：「今晚由你正選。」` : `一隊有數人受傷，主帥說今晚你會坐在後備席。第 70 分鐘，他叫你熱身。`);
      playMatch({ tag:gkx ? `${lg.short}・緊急正選` : `${lg.short}・後備入替`, home:c.n, opp:o.n, lvl:lvlFirst, diff:c.str-o.str, stake:2, youth:false, n:gkx?3:1, sub:!gkx, league:true,
        after:() => { se.fd++; S.pro.debut = true; logLine(`${S.age} 歲${c.n}一隊首秀（對${o.n}）`); } }, done); return; }
    const opp = pick(Object.values(S.W.clubs).filter(x=>x.cat>0&&x.id!==c.id));
    playMatch({ tag:c.lg==='PL'?'PL2':'U21 預備組', home:`${c.n} U21`, opp:`${opp.n} U21`, lvl:E(S.age)*0.97, diff:rf(-4,4), stake:1, youth:false, n:2, reserve:true }, done); return;
  }
  if(se.r===3){ playMatch({ tag:'預備組友誼賽', home:`${c.n} 預備組`, opp:`${o.n} 預備組`, lvl:lg.par-3, diff:rf(-3,3), stake:1, youth:false, n:1, reserve:true }, done); return; }
  const n = se.r===0 ? 3 : se.r===1 ? 2 : 1;
  const tag = derby ? `${lg.short}・${derby}` : se.r===2 && S.pos==='GK' ? '聯賽盃・後備門將上陣' : `${lg.short}・第 ${S.lt ? S.lt.T[c.lg][c.id].p+1 : '—'} 輪`;
  if(!S.pro.debut){ S.pro.debut = true; logLine(`${S.age} 歲${c.n}一隊首秀`); }
  const rv = isRivalClub(o.id);
  playMatch({ tag: rv ? `${lg.short}・宿敵對決` : tag, home:c.n, opp:o.n, lvl:lvlFirst, diff:c.str-o.str + clubBonus(), stake:derby||rv?2:1, youth:false, n, sub:se.r===2, league:!(se.r===2 && S.pos==='GK') }, r => { if(rv && r) rivalAfter(r); pressConf(r, { rv, derby }, () => done(r)); });
}

/* 一場比賽：先選親自上陣或模擬，然後 n 個關鍵時刻，最後戰報
   m：{ tag, home, opp, lvl, diff, stake, youth, n, sub, league, reserve, friendly, after } */
function playMatch(m, next){
  const gk = S.pos==='GK', lamF = clamp(1.35 + m.diff*0.06, 0.35, 3.2), lamA = clamp(1.3 - m.diff*0.06, 0.3, 3.2);
  const st = { a:0, b:0, myG:0, myA:0, ok:0, ng:0, log:[], fat0:S.m.fat, m0:{ ...S.m }, tr0:S.pro ? S.pro.trust : 0,
    otherF:Array.from({ length:poisson(lamF*0.72) }, () => ri(1,90)), otherA:Array.from({ length:poisson(lamA*0.8) }, () => ri(1,90)), extraA:[] };
  const mins = m.sub ? [ri(66,88)] : Array.from({ length:m.n }, () => ri(6,88)).sort((x,y)=>x-y);
  for(let i=1;i<mins.length;i++) if(mins[i] <= mins[i-1]) mins[i] = Math.min(89, mins[i-1]+3);
  st.mins = m.sub ? 90 - mins[0] + 2 : 90;
  const ctx = { tag:m.tag, opp:m.opp, lvl:m.lvl, stake:m.stake||1, youth:m.youth, ms:0.22, ts:0.08, home:m.home, sub:!!m.sub };
  UI.card('prematch', m.tag, prematchHTML(m), null, { m });
  const run = manual => {
    let i = 0;
    const step = () => {
      if(i >= mins.length) return finish();
      const min = mins[i++];
      st.a = st.otherF.filter(x=>x<min).length + st.myG + st.myA;
      st.b = st.otherA.filter(x=>x<min).length + st.extraA.filter(x=>x<min).length;
      const after = r => { record(r, min); step(); };
      if(manual) momentStep(ctx, { min, a:st.a, b:st.b }, after);
      else after(autoMoment(ctx, { min, a:st.a, b:st.b }));
    };
    const record = (r, min) => {
      const all = [r, ...(r.chain ? [r.chain] : [])];
      /* 冒險成功對評分幫助較大；穩健失敗扣分較多 */

function playPair(T, a, b, gfa, gfb){

  const A = T[a], B = T[b]; A.p++; B.p++; A.gf += gfa; A.ga += gfb; B.gf += gfb; B.ga += gfa;
  if(gfa>gfb){ A.w++; B.l++; A.pts += 3; } else if(gfa<gfb){ B.w++; A.l++; B.pts += 3; } else { A.d++; B.d++; A.pts++; B.pts++; }
}
function simRound(lg, forced){
  const T = S.lt.T[lg]; let ids = Object.keys(T);
  if(forced){ playPair(T, forced[0], forced[1], forced[2], forced[3]); ids = ids.filter(x => x!==forced[0] && x!==forced[1]); }
  shuffle(ids); for(let i=0;i+1<ids.length;i+=2) playPair(T, ids[i], ids[i+1]);
  S.lt.done[lg]++;
}
function leagueAdvance(p){
  if(!S.lt) seasonTableInit();
  LG_ORDER.forEach(lg => { const target = Math.min(LG[lg].g, Math.floor(p*LG[lg].g)); while(S.lt.done[lg] < target) simRound(lg); });
}
function leagueForced(lg, a, b, gfa, gfb){ if(!S.lt) seasonTableInit(); if(S.lt.done[lg] < LG[lg].g && S.lt.T[lg][a] && S.lt.T[lg][b]) simRound(lg, [a, b, gfa, gfb]); }
function leagueRoundFor(lg){ if(!S.lt) seasonTableInit(); if(S.lt.done[lg] < LG[lg].g) simRound(lg); }
function tableOf(lg){
  if(!S.lt || !S.lt.T[lg]) return [];
  return Object.entries(S.lt.T[lg]).map(([id,r]) => ({ id, ...r })).sort((a,b) => b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
}

/* ---------- 賽季目標：季前由主帥訂立，季尾結算 ---------- */
function setObjectives(){
  const se = S.season, c = club(curClub()), lg = LG[c.lg], pos = S.pos, g = POS[pos].g, O = [];
  if(se.dev){ O.push({ k:'rt', n:'預備組平均評分 6.8 或以上', v:6.8 }); O.push({ k:'fd', n:'爭取一隊上陣機會', v:1 }); }
  else {
    const pj = seasonProj(), appT = Math.round(pj.app*0.97); if(appT>0) O.push({ k:'app', n:`聯賽出場 ${appT} 場`, v:appT });
    if(pos==='GK'){ const t = Math.max(1, Math.round(pj.cs*1.05)); O.push({ k:'cs', n:`零封 ${t} 場`, v:t }); }
    else if(g==='ATT' || pos==='AM'){ const t = Math.max(1, Math.round(pj.g*1.15)); O.push({ k:'g', n:`入球 ${t} 個`, v:t }); }
    else if(g==='MID'){ const t = Math.max(1, Math.round(pj.a*1.15)); O.push({ k:'a', n:`助攻 ${t} 次`, v:t }); }
    else O.push({ k:'rt', n:'平均評分 6.9 或以上', v:6.9 });
    const list = clubsIn(c.lg).slice().sort((a,b)=>b.str-a.str), n = list.length, rank = list.findIndex(x=>x.id===c.id)+1;
    const t = clamp(rank+1, 1, n-3); O.push({ k:'pos', n: t<=1 ? '奪得聯賽冠軍' : t>=n-3 ? `成功護級（第 ${t} 或更高）` : `聯賽排名第 ${t} 或更高`, v:t });
  }
  se.obj = O;
  UI.card('event', '賽季目標', `主帥在季前會議上為你訂下目標：<br>${O.map(o=>`・${o.n}`).join('<br>')}<br><span class="hint">季尾逐項結算：達成可提升主帥信任、球迷人氣並獲得獎金。</span>`);
}
/* 按現時角色推算整季數據（不含隨機），用於主頁顯示進度 */
function seasonProj(){
  const se = S.season; if(!se || se.dev || se.r==null) return null;
  const c = club(curClub()), lg = LG[c.lg], pos = S.pos, gk = pos==='GK';
  const app = lg.g*(gk ? [.915,.5,.09,.015] : [.865,.575,.265,.03])[se.r], mpg = gk ? 90 : [86,72,26,20][se.r], n90 = app*mpg/90, lvl = lg.par;
  return { app, g:GOAL90[pos]*clamp(1+(eff('sho')-lvl)*0.035,0.3,2.3)*n90, a:AST90[pos]*clamp(1+((eff('pas')+eff('iq'))/2-lvl)*0.03,0.3,2.1)*n90,
    cs: gk ? app*clamp(0.24 + (c.str - lg.par)*0.018 + (ovr()-lvl)*0.012, 0.06, 0.58) : 0 };
}
function objectiveStatus(o){
  const se = S.season, pj = seasonProj(), lg = curLg();
  if(o.k==='pos'){ const rows = tableOf(lg), i = rows.findIndex(r=>r.id===curClub()); return { now:i>=0 ? `現時第 ${i+1}` : '—', ok:i>=0 && i+1<=o.v }; }
  if(o.k==='rt'){ const r = S.ss && S.ss.app ? S.ss.rt/S.ss.app : 0; return { now:r ? `親自比賽平均 ${r.toFixed(2)}` : '—', ok:r>=o.v }; }
  if(o.k==='fd') return { now:se.fd ? `已上陣 ${se.fd} 次` : '未有', ok:se.fd>=1 };
  if(!pj) return { now:'—', ok:false };
  const v = pj[o.k]; return { now:`按現時角色，預計季尾約 ${Math.round(v)}`, ok:v>=o.v };
}
function objectivesEnd(row, pos){
  const se = S.season; if(!se || !se.obj || !se.obj.length) return;
  const val = { app:row.app, g:row.g, a:row.a, cs:row.cs||0, rt:row.rt, fd:row.fd||0 };
  let hit = 0; const lines = se.obj.map(o => { const ok = o.k==='pos' ? pos<=o.v : (val[o.k]||0) >= o.v; if(ok) hit++; return `${ok?'✓':'✗'} ${o.n}${o.k==='pos'?`（第 ${pos}）`:o.k==='rt'?`（${(val.rt||0).toFixed(2)}）`:`（${val[o.k]||0}）`}`; });
  const bonus = hit * S.pro.wage * 3;
  const t = fx({ trust:hit*3 + (hit===se.obj.length?3:0) - (se.obj.length-hit>=2?5:0), fans:hit*2 });
  if(bonus) S.money = (S.money||0) + bonus;
  UI.card(hit===se.obj.length?'gold':hit?'':'bad', hit===se.obj.length?'賽季目標全部達成':'賽季目標結算', `${lines.join('<br>')}${bonus?`<br>目標獎金 ${money(bonus)}`:''}${t?`<div class="fx">${t}</div>`:''}`);
  if(hit===se.obj.length) S.flags.objAll = (S.flags.objAll||0) + 1;
}

      r => { T.app++; T.g += r.g; T.a += r.a; T.rt += r.rt; done({ ...r, played:true }); });
  };
  /* 分組賽 */
  const tab = [{ n:team, s:ts, me:true }, ...grp].map(x => ({ ...x, p:0, gd:0, gf:0 }));
  const add = (a, b, ga, gb) => { a.gf += ga; b.gf += gb; a.gd += ga-gb; b.gd += gb-ga; if(ga>gb) a.p += 3; else if(gb>ga) b.p += 3; else { a.p++; b.p++; } };
  const others = [[1,2],[1,3],[2,3]];
  let gi = 0;
  const groupStep = () => {
    if(gi>=3) return groupEnd();
    const o = tab[gi+1], [x,y] = others[gi];

      const a = tab[x], b = tab[y]; add(a, b, poisson(clamp(1.3+(a.s-b.s)*0.07,0.3,3)), poisson(clamp(1.3-(a.s-b.s)*0.07,0.3,3)));
      gi++; groupStep(); });

    const rk = tab.slice().sort((a,b) => b.p-a.p || b.gd-a.gd || b.gf-a.gf || R()-0.5), pos = rk.findIndex(x => x.me)+1;

    UI.card(pos<=2 ? 'good' : pos===3 && tab[0].p>=4 ? '' : 'bad', '分組賽排名', `<div class="lt"><table><thead><tr><th></th><th>球隊</th><th>得失</th><th>分</th></tr></thead><tbody>${rk.map((x,i) => `<tr class="${x.me?'me':''}"><td>${i+1}</td><td>${x.n}</td><td>${x.gd>0?'+':''}${x.gd}</td><td><b>${x.p}</b></td></tr>`).join('')}</tbody></table></div>`);
    if(pos<=2 || (pos===3 && tab[0].p>=4)) ko(0); else finish('分組賽出局');
  };
  /* 淘汰賽：打和便加時，再和便互射十二碼 */
  const KO = [['16 強',[74,84]],['8 強',[78,86]],['4 強',[80,88]],['決賽',[81,88]]], used = [...grp];
  const ko = i => {
    if(i>=KO.length) return finish('冠軍');
    const [rn, [lo,hi]] = KO[i], o = pickIn(lo, hi, used); used.push(o);
    if(i===2) UI.card('event', '四強', `全國都在談論${team}。街頭酒吧掛滿國旗，你的家人也飛來觀戰。`);
    if(i===3) UI.card('event', '決賽前夜', `${name}決賽。對手是${o.n}。你躺在酒店房間，想起六歲那年在公園第一次踢波的下午。`);
    game(o, rn==='決賽' ? '決賽' : `${rn}淘汰賽`, true, r => {
      const go = win => { if(win){ UI.card('good', `${team}晉級`, rn==='決賽' ? '' : `${team}淘汰${o.n}。`); ko(i+1); } else finish(rn==='決賽' ? '亞軍' : rn); };
      if(r.gf!==r.ga){ go(r.gf>r.ga); return; }
      if(chance(35)){ const w = chance(clamp(50 + (ts-o.s)*3, 20, 80)); UI.card(w?'good':'bad', '加時賽', w ? `第 ${ri(95,119)} 分鐘，${team}攻入致勝一球！` : `第 ${ri(95,119)} 分鐘，${o.n}在加時階段絕殺。`); go(w); return; }
      UI.card('event', '加時賽', '加時 30 分鐘雙方都沒有再入球。比賽要以互射十二碼決勝。');
      shootout(team, o.n, ts-o.s, r.played, go);
    });
  };
  const finish = res => {
    UI.newPage(`${yr} ${name}・總結`);
    addHonour(`${yr} ${name}（${res}）`, { intl:true, win:res==='冠軍' });
    logLine(`${yr} ${name}：${res}`);
    const avg = T.app ? T.rt/T.app : 0;
    if(T.g>=5){ addHonour(`${yr} ${name}金靴`, { intl:true }); logLine(`${yr} ${name}金靴（${T.g} 球）`); }
    if(['冠軍','亞軍'].includes(res) && avg>=7.6 && T.app>=5) addHonour(`${yr} ${name}最佳球員`, { intl:true });
    const t = fx(res==='冠軍' ? { fans:15, conf:10, love:5 } : res==='分組賽出局' ? { fans:-3, conf:-3 } : { fans:['亞軍','4 強'].includes(res)?6:2 });
    UI.card(res==='冠軍'?'gold':res==='分組賽出局'?'bad':'', `${yr} ${name}：${res}`,
      `${res==='冠軍' ? `${team}奪得${name}！全國如同放假一樣歡騰，你捧起獎盃的照片登上了每一份報章的頭版。` : res==='分組賽出局' ? `${team}在分組賽出局，傳媒的批評鋪天蓋地。` : `${team}在${name}止步${res}。`}
      <div class="statline"><span><b>${T.app}</b>出場</span><span><b>${T.g}</b>入球</span><span><b>${T.a}</b>助攻</span><span><b>${T.app?avg.toFixed(2):'—'}</b>平均評分</span></div>${t?`<div class="fx">${t}</div>`:''}`);

    next();
  };
  groupStep();
}
/* 互射十二碼：你負責第四球（門將則負責撲第四球） */
function shootout(team, opp, diff, onPitch, done){
  const mp = 0.76 + diff*0.004, op = 0.76 - diff*0.004, A = [], B = [], k = p => R() < p;
  for(let i=0;i<3;i++){ A.push(k(mp)); B.push(k(op)); }
  const sum = a => a.filter(Boolean).length, dots = a => a.map(x => x ? '●' : '○').join(' ');
  const board = () => `<div class="pens"><span>${team}</span><b>${dots(A)}</b><span>${opp}</span><b>${dots(B)}</b></div>`;
  const rest = mine => {
    if(S.pos==='GK'){ B.push(!mine); A.push(k(mp)); } else { A.push(mine); B.push(k(op)); }
    for(let i=4; i<5; i++){ A.push(k(mp)); B.push(k(op)); }
    let n = 0; while(sum(A)===sum(B) && n<12){ A.push(k(mp)); B.push(k(op)); n++; if(A.at(-1)!==B.at(-1)) break; }
    if(sum(A)===sum(B)) A[A.length-1] = !B.at(-1);
    const win = sum(A) > sum(B);
    UI.card(win?'gold':'bad', win ? `${team}互射十二碼勝出` : `${team}互射十二碼落敗`, `${board()}<p>${sum(A)}–${sum(B)}</p>`);
    done(win);
  };
  if(!onPitch){ UI.card('event', '互射十二碼', `你在場邊與隊友手牽手觀看。首三輪過後 ${sum(A)}–${sum(B)}。${board()}`); rest(k(S.pos==='GK'?0.24:mp)); return; }
  UI.card('event', '互射十二碼', `首三輪過後 ${sum(A)}–${sum(B)}。${board()}${S.pos==='GK' ? `${opp}第四名球員把皮球放在十二碼點上。你站在龍門線上，全場九萬人屏息靜氣。` : '主帥指着你：「第四球，你來。」你由中圈慢慢走向十二碼點。'}`);
  const conf = (S.m.conf-50)*0.002, calm = ((S.pers.calm||3)-3)*0.03, odds = SET.odds!==false;
  const opts = S.pos==='GK'
    ? [['撲向左邊', 0.24 + (eff('sho')-60)*0.003], ['撲向右邊', 0.24 + (eff('sho')-60)*0.003], ['企定中間', 0.17 + (eff('tec')-60)*0.002 + calm]]
    : [['射向左下角（穩陣）', 0.80 + (eff('sho')-60)*0.003 + conf + calm], ['大力射向右上角（冒險）', 0.70 + (eff('sho')-60)*0.007 + conf], ['輕挑射向中路（招牌）', 0.64 + (S.m.conf-50)*0.006 + calm*1.5]];
  UI.choose(S.pos==='GK' ? '撲向哪一邊？' : '射向哪裏？', opts.map(([t, p], i) => { p = clamp(p, 0.05, 0.95);
    return { t, s: odds ? `${S.pos==='GK'?'撲出機會':'成功率'} ${Math.round(p*100)}%` : '', pct: odds ? Math.round(p*100) : null, f:() => {
      const ok = R() < p;
      if(S.pos==='GK') UI.card(ok?'good':'bad', ok?'撲出十二碼！':'被射入', ok ? '你撲中方向，用指尖把皮球托出！' : '對方把皮球射進另一邊。');
      else { UI.card(ok?'good':'bad', ok?'射入！':'射失！', ok ? (i===2 ? '你輕輕一挑，皮球緩緩飛入網窩，門將早已撲向一邊！' : '皮球應聲入網，你向看台握拳怒吼。') : (i===1 ? '皮球高出橫樑。你雙手掩面。' : '門將撲中方向，把你的射門擋出。'));
        if(ok && i===2) fx({ fans:6 }); }
      if(ok){ S.flags.penHero = 1; pst().sp++; }
      rest(S.pos==='GK' ? ok : ok); } }; }));
}

/* ---------- 轉會市場 ---------- */
function marketValue(){
  const o = ovr(), a = S.age, af = a<=21?1.4 : a<=24?1.3 : a<=27?1.1 : a<=30?0.8 : a<=32?0.5 : 0.3;
  let v = 1e6 * Math.exp((o-60)*0.15) * af * (S.pro && S.pro.cyrs<=1 ? 0.65 : 1) * (S.pos==='GK'?0.7:1);
  v = v>=1e6 ? Math.round(v/1e5)*1e5 : Math.max(10000, Math.round(v/5e3)*5e3);
  return v;
}
/* 有興趣的球會（不使用隨機數，避免影響存檔的隨機序列） */
function interestList(){
  if(!S.pro) return [];
  const o = ovr(), lvNow = LG[club(curClub()).lg].lvl, hs = s => { let h = 2166136261; for(const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h,16777619); } return (h>>>0)%1000/1000; };
  const ss = S.ss && S.ss.app ? S.ss.rt/S.ss.app : S.pro.lastRt || 6.6, form = (ss-6.6)*12 + (S.m.fans-40)*0.2 + (S.pro.listed===S.year?12:0) + (S.agent?6:0);
  return Object.values(S.W.clubs).filter(x => x.id!==S.pro.club && x.id!==curClub() && x.lg!=='NON' && LG[x.lg].lvl >= lvNow-2 && o >= x.str-4 && x.str >= Math.min(o, club(curClub()).str) - (S.pro.listed===S.year ? 8 : 3))
    .map(x => ({ x, sc: -Math.abs(x.str - o - 1) + hs(`${S.year}${x.id}`)*6 }))
    .sort((a,b) => b.sc-a.sc).slice(0,5)
    .map(({x}, i) => { const lv = form - i*6 + hs(`${S.year}${S.term}${x.id}`)*20; return { c:x, lv: lv>=18?2 : lv>=4?1 : 0 }; });
}
/* 主動要求續約 */
function askRenew(){
  if(!S.pro || S.pro.loan || S.pro.semi || S.pro.renewAsk===S.year) return null;
  S.pro.renewAsk = S.year;
  const rc = roleCalc(), cur = club(S.pro.club);
  if(S.pro.trust>=60 && rc.r<=1){ const w = Math.max(S.pro.wage, wageFor(cur.id)), yrs = S.age>=31 ? 2 : ri(3,5);
    S.pro.wage = Math.round(w*1.05/50)*50; S.pro.cyrs = yrs; logLine(`${S.age} 歲與${cur.n}續約 ${yrs} 年`); fx({ conf:3 });
    return { ok:true, t:`${cur.n}與你續約 ${yrs} 年，週薪 ${money(S.pro.wage)}。` }; }
  fx({ trust:-1 });
  return { ok:false, t: rc.r>1 ? '主帥表示：「先爭取正選位置，再談新合約。」' : '球會表示要先觀察你今季的表現，夏天再談。' };
}
